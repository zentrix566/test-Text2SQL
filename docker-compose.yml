version: '3.8'

services:
  text2sql-mcp:
    build: .
    image: text2sql-mcp:latest
    environment:
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_SSL=${DB_SSL:-true}
    restart: unless-stopped
